<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de GestiÃ³n de Calidad (QMS)</title>
  <meta name="description" content="Sistema de GestiÃ³n de Calidad (QMS) - Control de documentos, auditorÃ­as ISO 9001, roles y permisos en Vue 3 con autenticaciÃ³n de Google.">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom Styles (Light Theme Glassmorphism) -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Vue 3 Global Build -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Soft Ambient Background Globes -->
  <div class="background-globes">
    <div class="globe globe-1"></div>
    <div class="globe globe-2"></div>
    <div class="globe globe-3"></div>
  </div>

  <!-- Vue 3 App Mount Root -->
  <div id="app">
    <!-- Navbar Component (Visible únicamente tras iniciar sesión) -->
    <app-navbar 
      v-if="isAuthenticated"
      :is-authenticated="isAuthenticated" 
      :user="currentUser">
    </app-navbar>

    <div :class="['app-layout-wrapper', { 'authenticated-layout': isAuthenticated }]">
      <!-- Vue Transition for smooth view switching -->
      <transition name="fade-slide" mode="out-in">
        <!-- View 1: Login Card Component (Unauthenticated) -->
        <main v-if="!isAuthenticated" key="login" class="login-wrapper">
          <login-card
            :google-client-id="googleClientId"
            :status-message="statusMessage"
            :status-type="statusType"
            :is-loading="isLoading"
            @google-success="onGoogleSuccess"
            @google-error="onGoogleError">
          </login-card>
        </main>

        <!-- View 2: Admin Dashboard Component (Authenticated) -->
        <div v-else key="admin" class="admin-wrapper">
          <admin-dashboard
            :user="currentUser"
            :token="jwtToken"
            :stats="stats"
            :documents="documents"
            :users="users"
            :roles="roles"
            @reload-data="loadDashboardData"
            @logout="handleLogout">
          </admin-dashboard>
        </div>
      </transition>
    </div>
  </div>

  <!-- Vue Components -->
  <script src="js/components/Navbar.js"></script>
  <script src="js/components/LoginCard.js"></script>
  <script src="js/components/UserProfile.js"></script>
  <script src="js/components/DocumentManager.js"></script>
  <script src="js/components/UserList.js"></script>
  <script src="js/components/RoleManager.js"></script>
  <script src="js/components/AdminDashboard.js"></script>

  <!-- Application Entry Point -->
  <script src="js/app.js"></script>
</body>
</html>
